name: Android CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation-tests:
    if: github.event.pull_request.draft == false
    runs-on: [ self-hosted, Android ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v5.0.0
        with:
          token: ${{ github.token }}
          submodules: recursive

      # The :kmpdav module (pulled in via the multiplatform-calendar composite build) uses the
      # Gobley Cargo/UniFFI plugins, so `cargo` must be on PATH for the Gradle process and the
      # Android Rust targets must be installed.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Setup Gradle and run Build
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Stop any stale Gradle daemon so the build picks up the updated PATH that just got update by the Rust toolchain setup
      - name: Stop stale Gradle daemons
        run: ./gradlew --stop

      - name: Clean gradle cache
        run: ./gradlew clean

      - name: Build with Gradle
        run: ./gradlew build

      # Run tests
      - name: Run Unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace
