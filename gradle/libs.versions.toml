[versions]
material3 = "1.5.0-alpha28" # Remove when composeBom use same version or higher
calendarCore = "0.10.1"
designsystem = "0.2.0"
haze = "2.0.0"
kizitonwoseCalendar = "2.10.1"
metrox = "1.4.4"

[libraries]
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
infomaniak-multiplatform-calendar-core-submodule = { module = "com.infomaniak.multiplaform-calendar:CalendarCore" }
infomaniak-multiplatform-calendar-core = { group = "com.infomaniak.multiplatform_calendar", name = "CalendarCore", version.ref = "calendarCore" }
infomaniak-designsystem-foundation = { module = "com.infomaniak.designsystem:Foundation", version.ref = "designsystem" }
infomaniak-designsystem-theme-calendar = { module = "com.infomaniak.designsystem:ThemeCalendar", version.ref = "designsystem" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }
kizitonwose-calendar-compose = { module = "com.kizitonwose.calendar:compose-multiplatform", version.ref = "kizitonwoseCalendar" }
metrox-viewmodel-compose = { group = "dev.zacsweers.metro", name = "metrox-viewmodel-compose", version.ref = "metrox" }
