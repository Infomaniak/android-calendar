# Project-wide Gradle settings.
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.daemon=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true

# Set to true in local.properties (git-ignored) to use the local multiplatform-calendar submodule
# source via composite build instead of the published AAR artifacts.
useCalendarCoreCompositeBuild=false
